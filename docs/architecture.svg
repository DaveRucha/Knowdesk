<svg viewBox="0 0 1500 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#67E8F9"/>
    </marker>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22D3EE" flood-opacity="0.12"/>
    </filter>
    <style>
      .box { fill: #111827; stroke: #26344A; stroke-width: 1.75; filter: url(#softGlow); }
      .box-accent { fill: #111827; stroke: #22D3EE; stroke-width: 2; filter: url(#softGlow); }
      .title { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #F1F5F9; font-size: 24px; font-weight: 700; }
      .sub { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #8FA3BF; font-size: 19px; }
      .section { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #67E8F9; font-size: 31px; font-weight: 700; }
      .flow { stroke: #67E8F9; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flowlabel { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #67E8F9; font-size: 18px; font-weight: 700; }
      .note { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #8FA3BF; font-size: 19px; }
      .footnote { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #64748B; font-size: 18px; }
    </style>
  </defs>

  <rect width="1500" height="920" fill="#0A0E17"/>

  <!-- ============ ROW 1: Document Ingestion ============ -->
  <text x="40" y="52" class="section">1. Document Ingestion</text>

  <g>
    <rect x="40" y="78" width="220" height="100" rx="10" class="box"/>
    <text x="150" y="120" class="title" text-anchor="middle">Admin uploads</text>
    <text x="150" y="148" class="sub" text-anchor="middle">a PDF file</text>

    <rect x="300" y="78" width="220" height="100" rx="10" class="box"/>
    <text x="410" y="120" class="title" text-anchor="middle">AWS S3</text>
    <text x="410" y="148" class="sub" text-anchor="middle">object storage</text>

    <rect x="560" y="78" width="220" height="100" rx="10" class="box"/>
    <text x="670" y="120" class="title" text-anchor="middle">BullMQ queue</text>
    <text x="670" y="148" class="sub" text-anchor="middle">Redis-backed</text>

    <rect x="820" y="78" width="360" height="100" rx="10" class="box"/>
    <text x="1000" y="112" class="title" text-anchor="middle">Standalone worker</text>
    <text x="1000" y="140" class="sub" text-anchor="middle">chunks (1000/200)</text>
    <text x="1000" y="164" class="sub" text-anchor="middle">+ generates embeddings</text>

    <rect x="1220" y="78" width="220" height="100" rx="10" class="box"/>
    <text x="1330" y="120" class="title" text-anchor="middle">pgvector</text>
    <text x="1330" y="148" class="sub" text-anchor="middle">Chunk table</text>

    <path d="M260,128 L300,128" class="flow"/>
    <path d="M520,128 L560,128" class="flow"/>
    <path d="M780,128 L820,128" class="flow"/>
    <path d="M1180,128 L1220,128" class="flow"/>
  </g>

  <!-- ============ ROW 2: Query & Answer ============ -->
  <text x="40" y="256" class="section">2. Query &amp; Answer</text>

  <g>
    <rect x="40" y="282" width="280" height="100" rx="10" class="box"/>
    <text x="180" y="324" class="title" text-anchor="middle">Employee asks</text>
    <text x="180" y="352" class="sub" text-anchor="middle">plain-English question</text>

    <rect x="360" y="282" width="280" height="100" rx="10" class="box"/>
    <text x="500" y="324" class="title" text-anchor="middle">Embed question</text>
    <text x="500" y="352" class="sub" text-anchor="middle">text-embedding-3-small</text>

    <rect x="680" y="282" width="340" height="100" rx="10" class="box-accent"/>
    <text x="850" y="312" class="title" text-anchor="middle">Cosine similarity</text>
    <text x="850" y="340" class="sub" text-anchor="middle">search &#8212; scoped to this</text>
    <text x="850" y="364" class="sub" text-anchor="middle">organization only</text>

    <rect x="1060" y="282" width="280" height="100" rx="10" class="box-accent"/>
    <text x="1200" y="316" class="title" text-anchor="middle" font-size="22">confidence</text>
    <text x="1200" y="342" class="title" text-anchor="middle" font-size="22">&#8805; 0.63 ?</text>
    <text x="1200" y="366" class="sub" text-anchor="middle">threshold gate</text>

    <path d="M320,332 L360,332" class="flow"/>
    <path d="M640,332 L680,332" class="flow"/>
    <path d="M1020,332 L1060,332" class="flow"/>

    <rect x="920" y="450" width="280" height="100" rx="10" class="box"/>
    <text x="1060" y="492" class="title" text-anchor="middle">Streamed answer</text>
    <text x="1060" y="520" class="sub" text-anchor="middle">gpt-4o-mini, cited</text>

    <rect x="1220" y="450" width="260" height="100" rx="10" class="box"/>
    <text x="1350" y="492" class="title" text-anchor="middle">Logged as gap</text>
    <text x="1350" y="520" class="sub" text-anchor="middle">no confident match</text>

    <path d="M1200,382 L1200,420 L1060,420 L1060,450" class="flow"/>
    <text x="1105" y="413" class="flowlabel" text-anchor="middle">yes</text>
    <path d="M1200,382 L1200,420 L1350,420 L1350,450" class="flow"/>
    <text x="1245" y="413" class="flowlabel" text-anchor="middle">no</text>
  </g>

  <!-- ============ Two-layer isolation ============ -->
  <rect x="30" y="620" width="1440" height="270" rx="14" fill="none" stroke="#22D3EE" stroke-width="1.75" stroke-dasharray="8,6" opacity="0.75"/>
  <text x="55" y="666" class="section">3. Two-Layer Multi-Tenant Isolation</text>

  <rect x="60" y="692" width="670" height="160" rx="10" class="box" stroke="#334155"/>
  <text x="395" y="726" class="title" text-anchor="middle">Application layer</text>
  <text x="395" y="758" class="note" text-anchor="middle">Every query filters by organizationId,</text>
  <text x="395" y="784" class="note" text-anchor="middle">sourced from the session token &#8212;</text>
  <text x="395" y="810" class="note" text-anchor="middle">never from request input</text>

  <rect x="760" y="692" width="680" height="160" rx="10" class="box" stroke="#334155"/>
  <text x="1100" y="726" class="title" text-anchor="middle">Database layer &#8212; Postgres RLS</text>
  <text x="1100" y="758" class="note" text-anchor="middle">Row Level Security on Document, Chunk,</text>
  <text x="1100" y="784" class="note" text-anchor="middle">Query, SOP, and Job &#8212; enforced via a</text>
  <text x="1100" y="810" class="note" text-anchor="middle">dedicated non-superuser database role</text>

  <text x="750" y="875" class="footnote" text-anchor="middle">Verified: a session for Org A cannot retrieve Org B's data &#8212; even with matching documents and identical embeddings.</text>
</svg>
