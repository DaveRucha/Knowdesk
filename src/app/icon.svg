  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <!-- Book spine -->
  <rect x="18" y="14" width="42" height="55" rx="5" fill="#4f46e5"/>
  <!-- Book spine highlight -->
  <rect x="18" y="14" width="8" height="55" rx="4" fill="#818cf8"/>
  <!-- Book lines -->
  <line x1="31" y1="28" x2="53" y2="28" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="31" y1="38" x2="53" y2="38" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="31" y1="48" x2="46" y2="48" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Magnifying glass circle -->
  <circle cx="58" cy="65" r="26" fill="none" stroke="#6366f1" stroke-width="5"/>
  <!-- Magnifying glass handle -->
  <line x1="77" y1="84" x2="90" y2="97" stroke="#6366f1" stroke-width="7" stroke-linecap="round"/>
